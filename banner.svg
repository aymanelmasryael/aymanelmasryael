  <text x="290" y="170" font-family="Inter, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#A3A3A3" letter-spacing="0.3">Visionary · AI Orchestrator · Brand Designer</text>

  <!-- Accent line -->
  <rect x="290" y="190" width="60" height="2" rx="1" fill="url(#accentGrad)"/>

  <!-- AEL Digital Studio -->
  <text x="290" y="220" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#0074FF" letter-spacing="4">AEL DIGITAL STUDIO</text>

  <!-- Right side: Version Badge -->
  <g transform="translate(950, 95)">
    <rect width="180" height="110" rx="12" fill="none" stroke="#0074FF" stroke-width="1.5" opacity="0.35"/>
    <text x="90" y="35" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#0074FF" letter-spacing="2">BRAND &amp; OS</text>
    <text x="90" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-1">v1.0</text>
    <text x="90" y="95" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="#737373" letter-spacing="0.5">Enterprise Edition</text>
  </g>

  <!-- Decorative dots -->
  <circle cx="1050" cy="60" r="2" fill="#0074FF" opacity="0.6"/>
  <circle cx="1150" cy="240" r="2" fill="#6C47FF" opacity="0.4"/>
