  <!-- Vertical divider -->
  <line x1="250" y1="70" x2="250" y2="230" stroke="#1A1A1A" stroke-width="1"/>

  <!-- Main Title: Ayman Elmasry -->
  <text x="290" y="130" font-family="Inter, -apple-system, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">Ayman Elmasry</text>

